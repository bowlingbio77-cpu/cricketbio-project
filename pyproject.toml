[project]
name = "paceai-cricket-biomechanics"
version = "1.0.0"
description = "AI cricket bowling biomechanics analysis: pose estimation, ball tracking, performance & injury-risk ML, and coaching recommendations from a single delivery video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "PaceAI" }]
keywords = ["cricket", "biomechanics", "computer-vision", "pose-estimation", "streamlit", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

# NOTE: this repository uses a flat layout (src/ package + root-level Streamlit
# entry points). Dependencies are pinned in requirements.txt for reproducibility
# of the committed model bundles; the `dependencies` list below is informational
# only and is NOT used for installation to avoid double-managing pins.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
